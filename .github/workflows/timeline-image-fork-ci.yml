# Fork-only CI for the timeline-image work (T1.0). The official ui-tests.yml
# needs self-hosted runners; this workflow runs the UI quality gates that do
# not require the full buildtools install (emsdk/C++ toolchain) on a plain
# GitHub-hosted ubuntu runner:
#   - TypeScript type check (tsc --noEmit)
#   - Full unit suite (vitest, 2568 tests)
# The integration specs and golden baselines need fixtures and stay local
# until the synthetic-trace coverage lands in CI (stage 2).
name: timeline-image (fork)
on:
  push:
    branches: [pr1-timeline-image]
  workflow_dispatch:
jobs:
  typecheck-and-unittests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Install UI dependencies
        run: pnpm install --frozen-lockfile
      - name: TypeScript check
        shell: bash
        run: |
          set -o pipefail
          ./node_modules/.bin/tsc --noEmit 2>&1 | tee tsc.log
      - name: Unit tests (full suite)
        run: ./node_modules/.bin/vitest run --config vitest.config.mjs
      - name: Upload tsc log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tsc-log
          path: ui/tsc.log
          if-no-files-found: warn
